name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_kind:
        description: Candidate packages stay explicitly unqualified; production requires the complete qualification bundle.
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - production
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/security/audit-release.mjs --root . --output artifacts/security-audit.json
      - run: npm run doctor -- --profile release --output artifacts/doctor.json
      - name: Select release mode
        id: mode
        shell: bash
        env:
          REQUESTED_KIND: ${{ inputs.release_kind }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$REQUESTED_KIND"
          elif [[ "$REF_NAME" == *-* ]]; then
            mode="candidate"
          else
            mode="production"
          fi
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - name: Build explicit release candidate
        if: steps.mode.outputs.value == 'candidate'
        shell: bash
        run: |
          set +e
          node scripts/release/build-release.mjs --output dist
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "Candidate build must complete with the explicit unqualified status (2), got $status."
            exit 1
          fi
      - name: Build qualified production package
        if: steps.mode.outputs.value == 'production'
        shell: bash
        env:
          QUALIFICATION_BUNDLE_BASE64: ${{ secrets.P10_QUALIFICATION_BUNDLE_BASE64 }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Production packaging is allowed only from an actual tag ref."
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            echo "Prerelease package version $version cannot be promoted as production."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version."
            exit 1
          fi
          if [ -z "$QUALIFICATION_BUNDLE_BASE64" ]; then
            echo "The P10_QUALIFICATION_BUNDLE_BASE64 repository secret is required."
            exit 1
          fi
          qualification="$RUNNER_TEMP/p10-qualification-bundle.json"
          printf '%s' "$QUALIFICATION_BUNDLE_BASE64" | base64 --decode > "$qualification"
          chmod 600 "$qualification"
          node scripts/release/validate-release-evidence.mjs \
            --input "$qualification" \
            --commit "$GITHUB_SHA" \
            --output artifacts/qualification-verification.json
          node scripts/release/build-release.mjs --output dist --qualification "$qualification"
          manifest="dist/vr-3d-skill-$version.release.json"
          node scripts/release/verify-release.mjs --manifest "$manifest" --tag "$GITHUB_REF_NAME" --output artifacts/release-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vr-3d-skill-${{ steps.mode.outputs.value }}-${{ github.run_id }}
          path: |
            artifacts/
            dist/
          if-no-files-found: error
