name: Validate Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.platform }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            node: 20
          - os: macos-latest
            platform: darwin
            node: 20
          - os: windows-latest
            platform: win32
            node: 20
          - os: ubuntu-latest
            platform: linux
            node: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run p10:code-acceptance
      - run: npm run doctor -- --profile release --output artifacts/doctor.json
      - name: Bind platform evidence
        run: node scripts/release/write-platform-evidence.mjs --acceptance examples/p10-acceptance/code-evidence.json --doctor artifacts/doctor.json --output artifacts/platform-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p10-${{ matrix.platform }}-node-${{ matrix.node }}
          path: |
            artifacts/doctor.json
            artifacts/platform-evidence.json
            examples/p10-acceptance/code-evidence.json
            examples/p10-acceptance/code-evidence-core-benchmark.json
            examples/p10-acceptance/code-evidence-security-audit.json
          if-no-files-found: error
